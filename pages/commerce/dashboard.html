<!-- VUE COMMERCE -->
<div id="view-store" class="view">
  <section class="hero">
    <h1>Mon Commerce</h1>
    <p>Gérez vos informations et votre inventaire</p>
  </section>

  <section id="store-dashboard-section" style="background:#f5f1e8">
    <div class="container">
      <div class="stats">
        <div class="stat">
          <div class="stat-val" id="store-total-products">0</div>
          <div class="stat-lbl">Produits</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="store-total-categories">0</div>
          <div class="stat-lbl">Catégories</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="store-total-orders">0</div>
          <div class="stat-lbl">Commandes reçues</div>
        </div>
      </div>
      <div class="admin-main" style="margin-top:2rem">
        <div id="store-info-content"></div>
        <div
          style="background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem;">
          <div id="store-name-display" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <span style="font-size: 0.8rem; color: #6b7280; text-transform: uppercase; font-weight: 600;">Nom du
                commerce</span>
              <div id="current-store-name-display"
                style="font-size: 1.3rem; font-weight: 700; color: #121212; margin-top: 0.2rem;">Chargement...</div>
            </div>
            <button onclick="toggleStoreNameEdit(true)"
              style="background: white; border: 1px solid #d1d5db; color: #4b5563; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">✏️
              Modifier</button>
          </div>
          <div id="store-name-edit-form"
            style="display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed #e5e7eb;">
            <div style="display: flex; gap: 0.5rem; align-items: flex-end; flex-wrap: wrap;">
              <div style="flex: 1; min-width: 200px;">
                <input type="text" id="store-name-input-pro" placeholder="Nouveau nom du commerce"
                  style="width: 100%; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 6px;">
              </div>
              <button onclick="saveStoreNamePro()"
                style="background: #1e1e1e; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600;">💾
                Sauvegarder</button>
              <button onclick="toggleStoreNameEdit(false)"
                style="background: transparent; color: #6b7280; border: 1px solid #d1d5db; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer;">Annuler</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="store-inventory-section" style="background:#f5f1e8;display:none">
    <div class="container">
      <div class="admin-header">
        <h3>📦 Gestion de l'Inventaire</h3>
      </div>

      <!-- Tab Buttons -->
      <div
        style="display:flex; gap:0.5rem; margin-bottom:1.5rem; border-bottom:1px solid #d1d5db; padding-bottom:0.5rem;">
        <button id="tab-btn-products" onclick="switchInventoryTab('products')"
          style="padding:8px 16px; border:none; background:none; cursor:pointer; font-weight:bold; border-bottom:2px solid transparent; color:#374151; transition: all 0.2s;">
          🛍️ Produits
        </button>
        <button id="tab-btn-categories" onclick="switchInventoryTab('categories')"
          style="padding:8px 16px; border:none; background:none; cursor:pointer; font-weight:bold; border-bottom:2px solid transparent; color:#374151; transition: all 0.2s;">
          📂 Catégories
        </button>
      </div>

      <!-- Products Tab Content -->
      <div id="inventory-products-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h4 style="margin:0;">Mes Produits</h4>
          <button class="btn-add" onclick="openStoreProductModal()">➕ Ajouter un produit</button>
        </div>
        <div id="inventory-products-container"></div>
      </div>

      <!-- Categories Tab Content -->
      <div id="inventory-categories-content" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h4 style="margin:0;">Mes Catégories</h4>
          <button class="btn-add" onclick="openStoreCategoryModal()">➕ Ajouter une catégorie</button>
        </div>
        <div id="inventory-categories-container"></div>
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 📦 SECTION COMMANDES DU COMMERCE           -->
  <!-- ========================================== -->
  <section id="store-orders-section" style="background:#f5f1e8; display:none;">
    <div class="container">
      <div class="admin-header">
        <h3>📦 Mes Commandes</h3>
      </div>
      <div id="store-orders-container">
        <!-- Les commandes seront injectées ici par renderStoreOrders() -->
      </div>
    </div>
  </section>
</div>
